# Visual identity for the Streamlit page (apps/agent/trip_agent/ui.py). Only Lane A edits this alongside ui.py.
# A travel brand: white ground, ink text, one ocean-blue accent for the things you click, the stop photos
# carrying the colour. Verified is green, draft is amber, failed and removed are red, and only those.

[theme]
base = "light"

primaryColor = "#0B5FD9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#14171C"

font = "Manrope, sans-serif"
headingFont = "Bricolage Grotesque, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseFontSize = 15
baseRadius = "0.6rem"
buttonRadius = "999px"

borderColor = "#E1E5EB"
dataframeBorderColor = "#E1E5EB"
dataframeHeaderBackgroundColor = "#F3F5F8"
showWidgetBorder = true

linkColor = "#0B5FD9"
linkUnderline = false

greenColor = "#1B8A5A"
greenTextColor = "#146B45"
greenBackgroundColor = "#E3F5EC"

orangeColor = "#B7791F"
orangeTextColor = "#8F5E14"
orangeBackgroundColor = "#FBF0DA"

redColor = "#D23F31"
redTextColor = "#A82F24"
redBackgroundColor = "#FBE5E2"

blueColor = "#0B5FD9"
blueTextColor = "#0B5FD9"
blueBackgroundColor = "#E4EDFB"
