[project]
name = "trip-itinerary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "trip-core",
  "httpx>=0.27",
  "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trip_itinerary"]
