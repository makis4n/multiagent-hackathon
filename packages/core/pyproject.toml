[project]
name = "trip-core"
version = "0.1.0"
description = "The contract: models, Protocols, fakes, the Gemini wrapper, the seed fixture"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trip_core"]
